<h1>ENERGREX 隐私权政策</h1>
<p>ENERGREX 是开发者本人自用的个人工具，不对外提供服务，也不向任何第三方收集用户数据。</p>
<h2>访问的数据</h2>
<p>应用只请求 Google Drive 的 drive.file 权限，即只能访问它自己创建的那一份文档，用来每天更新该文档的内容。它不读取、不修改你的 Drive 里的其他任何文件。</p>
<h2>数据的使用与共享</h2>
<p>应用不会把任何 Google 用户数据出售、共享或披露给第三方。授权令牌只保存在开发者本人的电脑上。</p>
